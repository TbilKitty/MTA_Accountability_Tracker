name: Archive public MTA feeds
on:
  workflow_dispatch:
  schedule:
    - cron: '20 10 * * *'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m src.collect --static --alerts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mta-public-feed-snapshots-${{ github.run_id }}
          path: data/raw/
          retention-days: 30
