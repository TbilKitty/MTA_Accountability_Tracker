name: Monitor MTA real-time service
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: mta-realtime-monitor
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GTFS-Realtime protobuf decoder
        run: pip install 'gtfs-realtime-bindings>=1.0,<2.0' 'protobuf>=4,<7'
      - name: Collect and summarize predictions
        env:
          SWIFTLY_API_KEY: ${{ secrets.SWIFTLY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/monitor_realtime.py
      - name: Archive raw snapshots as private-to-repository workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swiftly-raw-${{ github.run_id }}
          path: realtime-raw/
          retention-days: 30
      - name: Move daily files older than 7 days from the website to Google Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          # GitHub Pages sites are capped at 1 GB, so the site keeps only the latest 7 daily files.
          # A file is removed only after Google Drive confirms an identical copy.
          old=$(ls docs/data/predictions-????-??-??.json | sort | head -n -7)
          [ -z "$old" ] && { echo "Nothing to move"; exit 0; }
          if [ -z "${RCLONE_CONF:-}" ]; then echo "::warning::RCLONE_CONF not set; keeping old daily files on the site"; exit 0; fi
          for f in $old; do
            if bash scripts/drive_archive.sh published-daily "$f"; then git rm -q "$f"; else echo "::warning::Could not archive $f; kept on site"; fi
          done
      - name: Commit published aggregate evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/realtime-status.json docs/data/predictions-*.json
          if [ -f docs/data/hourly-totals.json ]; then git add docs/data/hourly-totals.json; fi
          if git diff --cached --quiet; then echo "Nothing new to commit"; exit 0; fi
          git commit -m 'Update MTA prediction observations'
          # The school-commute tracker also saves to this repo; if it saved first, re-sync and retry.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          echo "::error::Could not push after 3 attempts"; exit 1
      - name: Archive raw snapshots to Google Drive
        if: ${{ !cancelled() && hashFiles('realtime-raw/*.pb') != '' }}
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          # Fingerprint list for this run, saved next to the files (chain of custody).
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          (cd realtime-raw && sha256sum *.pb > "${stamp}_sha256.txt")
          bash scripts/drive_archive.sh "realtime/$(date -u +%Y/%m/%d)" realtime-raw/*
